# vim: ft=tmux
# Cyberpunk status bar — Dracula palette with neon yellow as hero accent

set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left

# --- Palette ---
%hidden BG='#000000'
%hidden FG='#dddddd'
%hidden DIM='#1a1a1a'
%hidden MUTED='#6272a4'
%hidden YELLOW='#faff00'
%hidden PURPLE='#bd93f9'
%hidden CYAN='#8be9fd'
%hidden PINK='#ff79c6'
%hidden GREEN='#50fa7b'

set -g status-style "bg=$BG,fg=$FG"

set -g status-left-length 100
set -g status-right-length 200

# --- Left: session ---
set -g status-left "#[fg=$YELLOW,bold]▍ #[fg=$BG,bg=$YELLOW,bold] #S #[fg=$YELLOW,bg=$BG,nobold] "

# --- Right: prefix indicator + time ---
set -g status-right "#[fg=$PINK,bold]#{?client_prefix,⌁ PFX  ,}#[fg=$YELLOW,bold]%H:%M #[fg=$YELLOW]▍"

# --- Window list ---
setw -g window-status-separator "#[fg=$DIM] · "
setw -g window-status-format "#[fg=$MUTED]#I #[fg=$DIM]#{b:pane_current_path}"
setw -g window-status-current-format "#[fg=$YELLOW,bold]#I #[fg=$YELLOW]#{b:pane_current_path}#{?window_zoomed_flag, ◆,}"
setw -g window-status-activity-style "fg=$PINK,bold"
setw -g window-status-bell-style "fg=$PINK,bold"

# --- Mode line (copy mode, etc) ---
set -g mode-style "fg=$BG,bg=$YELLOW,bold"

# --- Command / message line ---
set -g message-style "fg=$YELLOW,bg=$BG"
set -g message-command-style "fg=$YELLOW,bg=$BG"

# --- Clock ---
set -g clock-mode-colour "$YELLOW"
set -g clock-mode-style 24
